name: UX Diagnostics

on:
  pull_request:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies quietly
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q -r requirements-dev.txt
      - name: Capture unit-test output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > ux-test-output.txt 2>&1
          code=$?
          echo "$code" > ux-test-exit.txt
          tail -n 120 ux-test-output.txt
          exit 0
      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-diagnostics
          path: |
            ux-test-output.txt
            ux-test-exit.txt
      - name: Enforce test result
        shell: bash
        run: |
          test "$(cat ux-test-exit.txt)" -eq 0
