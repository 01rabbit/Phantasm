name: UX Diagnostics

on:
  pull_request:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies quietly
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q -r requirements-dev.txt
      - name: Run tests with compact failure output
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tail -n 85
